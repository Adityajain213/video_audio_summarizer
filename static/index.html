<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;document.documentElement.dataset.accent=localStorage.getItem("accent")||"violet"}catch(e){}</script>
<title>Recap – ask your videos anything</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--surface:#fff;--ink:#14213d;--muted:#5b6785;--line:#d9dfec;--blue:#2f5bff;--blue-soft:#e4eaff;--mark:#ffd84d;--bad:#c0332b;--on-ink:#fff;--link:#2f5bff;--shadow:var(--ink);color-scheme:light;
--display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--body:"Instrument Sans","Segoe UI",system-ui,sans-serif}
:root[data-theme=dark]{--bg:#0c1222;--surface:#141c31;--ink:#e9edf9;--muted:#99a4c4;--line:#27314d;--blue:#4f72ff;--blue-soft:#1b2750;--mark:#8a6d00;--bad:#ff7b72;--on-ink:#0c1222;--link:#8ea6ff;--shadow:var(--blue);color-scheme:dark}
:root[data-accent=violet]{--blue:#7c3aed;--blue-soft:#efe6ff;--link:#7c3aed;--sw:#7c3aed}
:root[data-accent=violet][data-theme=dark]{--blue:#8b5cf6;--blue-soft:#2a1f55;--link:#b9a2ff;--sw:#8b5cf6}
:root[data-accent=teal]{--blue:#0f766e;--blue-soft:#d5f3ef;--link:#0f766e;--sw:#0f766e}
:root[data-accent=teal][data-theme=dark]{--blue:#0d9488;--blue-soft:#0f3a39;--link:#5eead4;--sw:#0d9488}
:root[data-accent=green]{--blue:#15803d;--blue-soft:#dcf5e5;--link:#15803d;--sw:#15803d}
:root[data-accent=green][data-theme=dark]{--blue:#15803d;--blue-soft:#0f3a22;--link:#86efac;--sw:#15803d}
:root[data-accent=orange]{--blue:#c2410c;--blue-soft:#ffe9dc;--link:#c2410c;--sw:#c2410c}
:root[data-accent=orange][data-theme=dark]{--blue:#ea580c;--blue-soft:#4a2310;--link:#fdba74;--sw:#ea580c}
:root[data-accent=rose]{--blue:#e11d48;--blue-soft:#ffe4ea;--link:#e11d48;--sw:#e11d48}
:root[data-accent=rose][data-theme=dark]{--blue:#e11d48;--blue-soft:#4c1224;--link:#fda4af;--sw:#e11d48}
*{box-sizing:border-box;margin:0}
body,.panel,.intake,.field,.m,.pane li{transition:background-color .25s,border-color .25s,color .25s}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.logo{font:800 22px var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo i{width:26px;height:26px;border-radius:8px 8px 8px 2px;background:var(--blue);display:inline-block}
header small{color:var(--muted)}
.hdr{display:flex;align-items:center;gap:16px}
.theme{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:14px}
.theme:hover{border-color:var(--ink)}
.sw{display:flex;gap:8px}
.sw button{width:24px;height:24px;border-radius:50%;border:0;cursor:pointer;box-shadow:0 0 0 2px var(--bg),0 0 0 4px transparent}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
@media(max-width:700px){header small{display:none}.hdr{gap:10px}}
/* hero */
.hero{padding:48px 0 32px;max-width:760px}
h1{font:800 clamp(40px,7vw,76px)/.98 var(--display);letter-spacing:-.035em}
h1 mark{background:linear-gradient(transparent 62%,var(--mark) 62%);color:inherit}
.hero p{margin-top:20px;font-size:19px;color:var(--muted);max-width:56ch}
/* intake */
.intake{background:var(--surface);border:1.5px solid var(--ink);border-radius:20px;padding:20px;margin:32px 0 0;box-shadow:6px 6px 0 var(--shadow);max-width:820px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.field{flex:1 1 280px;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--bg)}
.field:focus-within{border-color:var(--blue)}
.field input{border:0;background:none;width:100%;padding:14px 0;outline:0}
.btn{border:0;border-radius:12px;padding:14px 24px;font-weight:600;background:var(--blue);color:#fff;cursor:pointer;transition:transform .12s,background .12s}
.btn:hover{filter:brightness(.9)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:wait}
.opts{display:flex;gap:16px;align-items:center;margin-top:14px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.drop{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.drop:hover,.drop.over{color:var(--link)}
.err{color:var(--bad);margin-top:12px;font-weight:500}
/* progress */
.progress{margin-top:18px;display:none}
.progress.on{display:block}
.steps{list-style:none;padding:0;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:15px}
.steps li::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.steps li.done{color:var(--ink)}.steps li.done::before{background:var(--blue);border-color:var(--blue)}
.steps li.now{color:var(--ink);font-weight:600}.steps li.now::before{border-color:var(--blue);animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--blue-soft)}}
/* workbench */
#bench{display:none;margin:56px 0 80px}
#bench.on{display:block}
.bench-title{font:700 clamp(26px,4vw,40px)/1.1 var(--display);letter-spacing:-.02em;margin-bottom:24px;max-width:24ch}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;overflow:hidden}
.tabs{display:flex;gap:4px;padding:10px;border-bottom:1.5px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--blue-soft);color:var(--link)}
.tabs span{font-weight:500;margin-left:6px;font-size:13px;opacity:.8}
.pane{padding:24px;max-height:620px;overflow:auto}
.pane h4{font:700 17px var(--display);margin:18px 0 6px}
.pane p{margin:0 0 12px;max-width:68ch}
.pane ul{padding-left:0;list-style:none;display:grid;gap:10px;margin-bottom:12px}
.pane li{padding:12px 14px 12px 40px;background:var(--bg);border-radius:12px;position:relative}
.pane li::before{content:"";position:absolute;left:14px;top:17px;width:14px;height:14px;border-radius:4px;background:var(--surface);border:2px solid var(--link)}
.pane.plain p{color:var(--muted);white-space:pre-wrap}
.tools{display:flex;justify-content:flex-end;padding:0 24px 18px}
.ghost{border:1.5px solid var(--line);background:none;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:14px;font-weight:500}
.ghost:hover{border-color:var(--ink)}
/* chat */
.chat{display:flex;flex-direction:column;height:700px}
.chat h3{font:700 18px var(--display);padding:18px 20px;border-bottom:1.5px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:11px 15px;border-radius:16px;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--ink);color:var(--on-ink);border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.dots{display:inline-flex;gap:4px}.dots b{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots b:nth-child(2){animation-delay:.15s}.dots b:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 12px}
.chips button{border:1.5px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chips button:hover{border-color:var(--blue);color:var(--link)}
.ask{display:flex;gap:8px;padding:14px;border-top:1.5px solid var(--line)}
.ask input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.ask input:focus{border-color:var(--blue);outline:0}
@media(max-width:900px){.grid{grid-template-columns:1fr}.chat{height:560px}.intake{box-shadow:4px 4px 0 var(--shadow)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo"><i></i>Recap</div><div class="hdr"><small>Meetings, lectures and videos, made searchable</small><div class="sw" id="sw" role="group" aria-label="Accent color"></div><button class="theme" id="theme" type="button" aria-label="Switch color theme"></button></div></header>

  <section class="hero">
    <h1>Watch less. <mark>Know more.</mark></h1>
    <p>Paste a YouTube link or upload a recording. Get a summary, action items, decisions and open questions, then ask the video anything.</p>
  </section>

  <form class="intake" id="form">
    <div class="row">
      <label class="field"><span aria-hidden="true">🔗</span>
        <input id="src" placeholder="Paste a YouTube link" aria-label="YouTube link"></label>
      <button class="btn" id="go" type="submit">Analyze video</button>
    </div>
    <div class="opts">
      <span>or <label class="drop" id="drop" for="file">upload audio or video</label><input id="file" type="file" accept="audio/*,video/*" hidden> <span id="fname"></span></span>
      <span class="seg" role="group" aria-label="Language">
        <button type="button" aria-pressed="true" data-l="english">English</button>
        <button type="button" aria-pressed="false" data-l="hinglish">Hinglish</button>
      </span>
    </div>
    <div class="progress" id="prog"><ul class="steps" id="steps"></ul></div>
    <p class="err" id="err" role="alert"></p>
  </form>

  <main id="bench">
    <h2 class="bench-title" id="title"></h2>
    <div class="grid">
      <section class="panel">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="pane" id="pane" role="tabpanel"></div>
        <div class="tools"><button class="ghost" id="copy" type="button">Copy this tab</button></div>
      </section>
      <section class="panel chat">
        <h3>Ask this video</h3>
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <div class="chips" id="chips"></div>
        <form class="ask" id="ask"><input id="q" placeholder="What did they decide about the budget?" aria-label="Your question" autocomplete="off"><button class="btn" type="submit">Ask</button></form>
      </section>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const root = document.documentElement;

// Update the theme button label.
function paintTheme() {
  $("theme").textContent =
    root.dataset.theme === "dark" ? "☀️ Light" : "🌙 Dark";
}

// Handle Light/Dark mode switching.
$("theme").onclick = () => {
  root.dataset.theme =
    root.dataset.theme === "dark" ? "light" : "dark";

  try {
    localStorage.setItem("theme", root.dataset.theme);
  } catch (e) {}

  paintTheme();
}; // IMPORTANT: Close the theme handler here.

// Keep this code OUTSIDE the theme handler.
const ACCENTS = {
  violet: "#7c3aed",
  teal: "#0f766e",
  green: "#15803d",
  orange: "#c2410c",
  rose: "#e11d48"
};

function paintAccents() {
  $("sw").innerHTML = Object.entries(ACCENTS).map(([k, c]) =>
    `<button type="button" data-a="${k}" style="background:${c}"
      aria-label="${k}"
      aria-pressed="${root.dataset.accent === k}"></button>`
  ).join("");

  $("sw").querySelectorAll("button").forEach(b => {
    b.onclick = () => {
      root.dataset.accent = b.dataset.a;

      try {
        localStorage.setItem("accent", b.dataset.a);
      } catch (e) {}

      paintAccents();
    };
  });
}

// Initialize both controls when the page loads.
if (!ACCENTS[root.dataset.accent]) {
  root.dataset.accent = "violet";
}

paintTheme();
paintAccents();

const STEPS = ["Fetching the audio","Transcribing speech","Writing the summary","Finding actions, decisions and questions","Preparing chat"];
const TABS = [["summary","Summary"],["action_items","Action items"],["key_decisions","Decisions"],["open_questions","Open questions"],["transcript","Transcript"]];
const SUGGEST = ["Who owns which task?","What was decided?","What was left unresolved?"];
let lang = "english", sid = null, data = null, tab = "summary", timer = null;

document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  lang = b.dataset.l;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
});
$("file").onchange = e => { $("fname").textContent = e.target.files[0]?.name || ""; if (e.target.files[0]) $("src").value = ""; };
["dragover","dragleave","drop"].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); $("drop").classList.toggle("over", ev === "dragover");
  if (ev === "drop" && e.dataTransfer.files[0]) { $("file").files = e.dataTransfer.files; $("file").onchange({target: $("file")}); }
}));

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`(.+?)`/g,"<code>$1</code>");
function md(t) {
  if (!t.trim()) return "<p>Nothing found in this section.</p>";
  let out = "", list = false;
  for (const raw of t.split("\n")) {
    const l = raw.trim(), li = l.match(/^([-*•]|\d+[.)])\s+(.*)/), h = l.match(/^#{1,4}\s+(.*)/);
    if (li) { if (!list) { out += "<ul>"; list = true; } out += `<li>${inline(li[2])}</li>`; continue; }
    if (list) { out += "</ul>"; list = false; }
    if (h) out += `<h4>${inline(h[1])}</h4>`; else if (l) out += `<p>${inline(l)}</p>`;
  }
  return out + (list ? "</ul>" : "");
}
const count = t => (t.match(/^\s*([-*•]|\d+[.)])\s+/gm) || []).length;

function renderTabs() {
  $("tabs").innerHTML = TABS.map(([k, n]) => {
    const c = ["action_items","key_decisions","open_questions"].includes(k) ? count(data[k]) : 0;
    return `<button role="tab" aria-selected="${k === tab}" data-k="${k}">${n}${c ? `<span>${c}</span>` : ""}</button>`;
  }).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.k; renderTabs(); });
  const pane = $("pane");
  pane.className = "pane" + (tab === "transcript" ? " plain" : "");
  pane.innerHTML = tab === "transcript" ? `<p>${esc(data.transcript)}</p>` : md(data[tab]);
}

function progress(on) {
  const ul = $("steps"); clearInterval(timer);
  $("prog").classList.toggle("on", on); if (!on) return;
  let i = 0;
  const draw = () => ul.innerHTML = STEPS.map((s, n) => `<li class="${n < i ? "done" : n === i ? "now" : ""}">${s}</li>`).join("");
  draw(); timer = setInterval(() => { if (i < STEPS.length - 1) { i++; draw(); } }, 9000);
}

$("form").onsubmit = async e => {
  e.preventDefault(); $("err").textContent = "";
  const f = $("file").files[0], src = $("src").value.trim();
  if (!f && !src) { $("err").textContent = "Add a YouTube link or upload a file."; return; }
  const fd = new FormData(); fd.append("source", src); fd.append("language", lang); if (f) fd.append("file", f);
  $("go").disabled = true; $("go").textContent = "Analyzing…"; progress(true);
  try {
    const r = await fetch("/api/process", { method: "POST", body: fd });
    const j = await r.json(); if (!r.ok) throw new Error(j.detail || "Something went wrong.");
    data = j; sid = j.session_id; tab = "summary";
    $("title").textContent = j.title; renderTabs();
    $("msgs").innerHTML = ""; say("a", "I've read the whole video. Ask me anything about it.");
    $("chips").innerHTML = SUGGEST.map(s => `<button type="button">${s}</button>`).join("");
    $("chips").querySelectorAll("button").forEach(b => b.onclick = () => send(b.textContent));
    $("bench").classList.add("on"); $("bench").scrollIntoView({ behavior: "smooth" });
  } catch (x) { $("err").textContent = x.message; }
  progress(false); $("go").disabled = false; $("go").textContent = "Analyze video";
};

function say(role, text) {
  const d = document.createElement("div"); d.className = "m " + role; d.textContent = text;
  $("msgs").appendChild(d); $("msgs").scrollTop = 1e9; return d;
}
async function send(q) {
  if (!q || !sid) return; $("chips").innerHTML = ""; say("u", q);
  const t = say("a", ""); t.innerHTML = '<span class="dots"><b></b><b></b><b></b></span>';
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: sid, question: q }) });
    const j = await r.json(); t.textContent = r.ok ? j.answer : (j.detail || "Couldn't get an answer. Try again.");
  } catch { t.textContent = "Couldn't reach the server. Check that it is running."; }
  $("msgs").scrollTop = 1e9;
}
$("ask").onsubmit = e => { e.preventDefault(); const q = $("q").value.trim(); $("q").value = ""; send(q); };
$("copy").onclick = async () => {
  await navigator.clipboard.writeText(data[tab]); $("copy").textContent = "Copied";
  setTimeout(() => $("copy").textContent = "Copy this tab", 1500);
};
</script>
</body>
</html>
